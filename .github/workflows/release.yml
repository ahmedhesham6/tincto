name: release

# A push to main releases the version in package.json when npm does not have it:
# publish to npm, a Git tag, and a GitHub release with notes.
# To release: change "version" in package.json in a pull request, or run this
# workflow by hand with a bump. The publish uses npm trusted publishing (OIDC):
# there is no npm token in this repository.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Make a new version first, then release it
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write # the tag, the release, and the version commit of a bump
  id-token: write # npm trusted publishing and provenance

concurrency: release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      # npm 11.5.1 is the first version with trusted publishing.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --global npm@latest

      - name: Bump the version
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npm version "${{ inputs.bump }}" --no-git-tag-version
          git commit --all --message "Release $(node --print "require('./package.json').version")"
          git push

      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun test

      - name: Read the version
        id: version
        run: |
          name=$(node --print "require('./package.json').name")
          version=$(node --print "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
          if git ls-remote --exit-code --tags origin "v$version" >/dev/null; then
            echo "tagged=true" >> "$GITHUB_OUTPUT"
          else
            echo "tagged=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.version.outputs.published == 'false'
        run: npm publish --access public --provenance

      - name: Tag and make the GitHub release
        if: steps.version.outputs.tagged == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${{ steps.version.outputs.version }}" --target "$(git rev-parse HEAD)" --generate-notes
